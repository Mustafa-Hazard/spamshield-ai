name: SpamShield AI - CI Pipeline & Security Gates

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  quality-and-security:
    name: Code Quality & Security Auditing
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository source code
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Set up an isolated Python runtime environment
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Fixed parameter from python-node to python-version
        cache: 'pip' # Automated caching for faster workflow runs

    # 3. Upgrade package installer and fetch verification tools
    - name: Install Linting & Security Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 bandit

    # 4. Strict formatting validation (Enforces clean coding habits)
    - name: Verify Code Style (Black Formatter)
      run: |
        # Checks the current directory but excludes the virtual environment folder
        black --check . --exclude "venv/|.venv/"

    # 5. Syntax and anti-pattern analysis via Flake8
    - name: Lint Code Architecture (Flake8)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. 
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 6. Static Application Security Testing (SAST)
    - name: Execute Security Vulnerability Audit (Bandit)
      run: |
        # Run security check recursively across the project directory, skipping your venv folder
        bandit -r . --exclude "./venv,./.venv" -lll